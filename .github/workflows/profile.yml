# Builds every dynamic profile asset and publishes them to the `output` branch.
#
# Why one workflow + a separate branch:
#   * main stays clean — no more "Update github-metrics.svg" commits every 6h
#   * one orphan commit is force-pushed to `output`, so that branch never grows
#   * if any generator fails, the previous render is kept (we start from the
#     current `output` contents), so the README never shows a broken image
name: Profile assets

on:
  schedule:
    - cron: "23 */8 * * *"        # off the top of the hour to avoid Actions queue spikes
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      USERNAME: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore current output branch
        run: |
          set -euo pipefail
          mkdir -p dist
          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch --depth 1 origin output
            git --work-tree=dist checkout FETCH_HEAD -- .
            git reset -q            # keep main's index clean
          fi
          ls -la dist

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s scripts -v

      - name: Stats cards (self-hosted)
        continue-on-error: true
        env:
          # METRICS_TOKEN (classic PAT: read:user + repo) includes private work;
          # falls back to the built-in token (public data only).
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/gen_stats.py --user "$USERNAME" --out dist/stats

      - name: Contribution snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # NOTE: no `id:` here — lowlighter/metrics derives "official vs fork" from the
      # step id; setting one makes it skip the prebuilt image and rebuild from source.
      - name: Deep metrics (3D calendar, habits, achievements)
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          output_action: none
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_habits_days: 30
          plugin_habits_from: 200
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_limit: 8

      - name: Collect metrics render
        if: always()
        run: |
          if [ -f /metrics_renders/metrics.svg ]; then
            sudo cp /metrics_renders/metrics.svg dist/metrics.svg
          else
            echo "::warning::metrics render missing — keeping previous dist/metrics.svg"
          fi

      - name: Publish to output branch
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$(ls -A .)" || { echo "nothing rendered"; exit 1; }
          git init -q -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "profile assets $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
