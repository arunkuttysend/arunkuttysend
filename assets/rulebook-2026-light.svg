<text x="28" y="44" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="2.5" fill="#51607e">DELIVERABILITY RESEARCH · 2026 BULK-SENDER RULEBOOK</text>
<text x="28" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f172a">Authentication isn’t a best practice anymore — it’s the <tspan fill="url(#rbAur)">entry ticket</tspan>.</text>
<text x="28" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#51607e">Applies at 5,000+ messages/day to a provider. Non-compliance is now a permanent 5xx reject, not a spam-folder nudge.</text>
