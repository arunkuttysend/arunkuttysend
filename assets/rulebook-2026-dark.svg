<text x="28" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#e8edff">Authentication isn’t a best practice anymore — it’s the <tspan fill="url(#rbAur)">entry ticket</tspan>.</text>
