<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="262" viewBox="0 0 1200 262" role="img" aria-label="Email delivery pipeline: App → Queue → MTA pool → Auth → ISPs → Inbox, with bounce/FBL loop"><title>Email delivery pipeline: App → Queue → MTA pool → Auth → ISPs → Inbox, with bounce/FBL loop</title><style>.flow{stroke-dasharray:4 6;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-20}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
